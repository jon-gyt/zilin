name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm test
      # Avec la variable de dépôt SITE_ORIGIN (https://wenlu.app, posée une fois le domaine
      # personnalisé réglé dans Settings, Pages), le site est servi à la racine du domaine ;
      # sans elle, sous l'adresse GitHub Pages du dépôt, comme avant.
      - name: Base et origine du site
        env:
          SITE_ORIGIN_VAR: ${{ vars.SITE_ORIGIN }}
        run: |
          if [ -n "$SITE_ORIGIN_VAR" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
            echo "SITE_ORIGIN=$SITE_ORIGIN_VAR" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
            echo "SITE_ORIGIN=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - run: npm run site
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
