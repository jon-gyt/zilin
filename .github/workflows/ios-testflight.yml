name: ios-testflight
on:
  push:
    tags: ['ios-*']
jobs:
  build:
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run build
      - name: Générer le projet iOS
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      # Chaque greffon natif de package.json (haptique, notifications locales, demande de
      # note) doit être dans le Podfile engendré : sinon l'app s'archive sans lui, et
      # l'appel échoue en silence sur l'iPhone.
      - name: Vérifier les greffons natifs
        run: |
          node -e '
            const fs = require("fs");
            const deps = Object.keys(require("./package.json").dependencies);
            const podfile = fs.readFileSync("ios/App/Podfile", "utf8");
            const manquants = [];
            for (const d of deps) {
              const p = require(`${d}/package.json`);
              if (!p.capacitor || !p.capacitor.ios) continue;
              const spec = fs.readdirSync(`node_modules/${d}`).find((f) => f.endsWith(".podspec"));
              const pod = spec && spec.replace(/\.podspec$/, "");
              console.log(`${d} -> ${pod}`);
              if (!pod || !podfile.includes(`pod '"'"'${pod}'"'"'`)) manquants.push(d);
            }
            if (manquants.length) { console.error(`Absents du Podfile : ${manquants.join(", ")}`); process.exit(1); }
          '
      # Ce que l'app iOS a de propre, reposé à chaque build sur le projet engendré :
      # manifeste de confidentialité, icône 1024, écran de lancement papier, Info.plist
      # (ITSAppUsesNonExemptEncryption, thème clair, la phrase du micro de « Dis-le »),
      # version tirée du tag et numéro de build tiré du run (TestFlight refuse deux fois le
      # même). Voir docs/ios-sans-mac.md.
      - name: Retoucher le projet iOS
        env:
          WENLU_VERSION: ${{ github.ref_name }}
          WENLU_BUILD: ${{ github.run_number }}
        run: |
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install --user-install --no-document xcodeproj
          ruby ios-template/patch.rb
          # Sans cette phrase, iOS ferme l'app au premier appel du micro (« Dis-le »).
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' ios/App/App/Info.plist
      - name: Scheme partagé
        run: |
          mkdir -p ios/App/App.xcodeproj/xcshareddata/xcschemes
          cat > ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1500" version="1.7">
            <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
              <BuildActionEntries><BuildActionEntry buildForRunning="YES" buildForArchiving="YES" buildForTesting="YES" buildForProfiling="YES" buildForAnalyzing="YES">
                <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="504EC3031FED79650016851F" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"/>
              </BuildActionEntry></BuildActionEntries>
            </BuildAction>
            <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"/>
            <LaunchAction buildConfiguration="Debug"/><ProfileAction buildConfiguration="Release"/><AnalyzeAction buildConfiguration="Debug"/>
          </Scheme>
          XML
      # Signature automatique, sans certificat ni profil dans le dépôt ou les secrets :
      # l'archive est faite sans signer, puis l'export signe avec le certificat de
      # distribution géré par Apple (cloud-managed) et crée lui-même le profil App Store,
      # par la clé API App Store Connect. Il faut une clé de rôle Admin (le seul rôle qui
      # a accès aux certificats gérés par Apple) et le bundle id `com.zilin.app` déjà
      # enregistré sur developer.apple.com. Le bundle id garde le nom d'avant Wenlu : un
      # bundle id ne se renomme pas. Le nom affiché vient d'appName (capacitor.config.ts).
      - name: Clé API App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          # Le secret est le texte du .p8 collé tel quel, ou ce même fichier en base64.
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" | base64 -d > "$KEY"
          fi
          grep -q 'BEGIN PRIVATE KEY' "$KEY" || { echo "ASC_KEY_P8 ne contient pas de clé .p8 lisible"; exit 1; }
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Archive et export
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios/App && pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive archive DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          cat > ExportOptions.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string></dict></plist>
          PL
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/out -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f ios/App/build/out/App.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
