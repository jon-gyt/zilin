[project]
name = "wenlu-data"
version = "0.1.0"
description = "Pipeline de contenu Wenlu : sources, graphe de familles, fiches FR/EN, export JSON"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "typer>=0.12",
    "anthropic>=0.40",
    "fonttools[woff]>=4.53",
    "lunar-python>=1.4.8",
]

[project.optional-dependencies]
# Voix locale (story 1.5). Hors installation de base : `kokoro` tire torch et
# transformers, soit plusieurs centaines de Mo dont le reste du pipeline n'a que
# faire. `uv sync --extra audio` avant `wenlu audio generer`.
# `misaki[zh]` porte le G2P mandarin (jieba, pypinyin, cn2an) ; sans lui, Kokoro
# n'a pas de voix chinoise.
audio = ["kokoro>=0.9.4", "misaki[zh]>=0.9.4"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
wenlu = "wenlu_data.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
