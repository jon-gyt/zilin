[project]
name = "zilin-data"
version = "0.1.0"
description = "Pipeline de contenu Zilin : sources, graphe de familles, fiches FR/EN, export JSON"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2", "typer>=0.12", "anthropic>=0.40"]

[project.scripts]
zilin = "zilin_data.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
